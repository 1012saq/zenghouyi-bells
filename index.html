    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const loading = document.getElementById('loading');
        const infoName = document.getElementById('bellName');
        const infoDetail = document.getElementById('bellDetail');
        const infoPitch = document.getElementById('bellPitch');
        const controlsHint = document.getElementById('controlsHint');
        const introPanel = document.getElementById('introPanel');
        const infoPanel = document.getElementById('infoPanel');
        const introCollapseBtn = document.getElementById('introCollapseBtn');
        const infoCollapseBtn = document.getElementById('infoCollapseBtn');
        const playBtn = document.getElementById('playBtn');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const songSelector = document.getElementById('songSelector');
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const songMenu = document.getElementById('songMenu');
        const songMenuClose = document.getElementById('songMenuClose');
        const viewPresetsPanel = document.getElementById('viewPresets');
        const viewCollapseBtn = document.getElementById('viewCollapseBtn');
        const playerPanel = document.getElementById('playerPanel');

        // 面板收起/展开
        function togglePanelCollapse(panel, btn) {
            panel.classList.toggle('collapsed');
            const isCollapsed = panel.classList.contains('collapsed');
            btn.textContent = isCollapsed ? '+' : '—';
            btn.title = isCollapsed ? '展开' : '收起';
        }
        introCollapseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePanelCollapse(introPanel, introCollapseBtn);
        });
        infoCollapseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePanelCollapse(infoPanel, infoCollapseBtn);
        });
        // 视角按钮收起/展开
        viewCollapseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            viewPresetsPanel.classList.toggle('collapsed');
            const isCollapsed = viewPresetsPanel.classList.contains('collapsed');
            viewCollapseBtn.textContent = isCollapsed ? '+' : '—';
            viewCollapseBtn.title = isCollapsed ? '展开视角' : '收起视角';
        });
        // 面板拖动功能（player-panel view-presets 可拖动）
        function makeDraggable(panel) {
            if (!panel) return;
            let isDragging = false;
            let startX, startY, startLeft, startTop;
            panel.addEventListener('mousedown', (e) => {
                // 点击按钮时不拖动
                if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                const rect = panel.getBoundingClientRect();
                startLeft = rect.left;
                startTop = rect.top;
                panel.style.transition = 'none';
                panel.style.left = startLeft + 'px';
                panel.style.top = startTop + 'px';
                panel.style.right = 'auto';
                panel.style.bottom = 'auto';
                e.preventDefault();
            });
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                panel.style.left = (startLeft + dx) + 'px';
                panel.style.top = (startTop + dy) + 'px';
            });
            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    panel.style.transition = '';
                }
            });
            // 触摸支持
            panel.addEventListener('touchstart', (e) => {
                if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
                isDragging = true;
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                const rect = panel.getBoundingClientRect();
                startLeft = rect.left;
                startTop = rect.top;
                panel.style.transition = 'none';
                panel.style.left = startLeft + 'px';
                panel.style.top = startTop + 'px';
                panel.style.right = 'auto';
                panel.style.bottom = 'auto';
            }, { passive: true });
            document.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const touch = e.touches[0];
                const dx = touch.clientX - startX;
                const dy = touch.clientY - startY;
                panel.style.left = (startLeft + dx) + 'px';
                panel.style.top = (startTop + dy) + 'px';
            }, { passive: true });
            document.addEventListener('touchend', () => {
                if (isDragging) { isDragging = false; panel.style.transition = ''; }
            });
        }
        makeDraggable(playerPanel);
        makeDraggable(viewPresetsPanel);

        // 曲目菜单切换
        function toggleSongMenu() {
            songMenu.classList.toggle('show');
        }
        menuToggleBtn.addEventListener('click', toggleSongMenu);
        songMenuClose.addEventListener('click', () => songMenu.classList.remove('show'));
        // 点击曲目后自动关闭菜持
        songSelector.addEventListener('click', (e) => {
            if (e.target.closest('.song-btn')) {
                setTimeout(() => songMenu.classList.remove('show'), 300);
            }
        });

        // ─── 场景（燕云十六声暖琥珀色调）───
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x140e08);
        scene.fog = new THREE.FogExp2(0x1e140a, 0.028);

        const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 150);
        camera.position.set(13, 7, 16);
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        labelRenderer.domElement.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;';
        container.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.075;
        controls.autoRotate = false;
        controls.autoRotateSpeed = 0.35;

        // ══════════════════════════════════════════════════
        //  灯光系统（燕云十六声暖金武侠持+ 宴会暖光持
        // ══════════════════════════════════════════════════

        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0x6a5030, 0x1a0e06, 0.5);
        scene.add(hemiLight);

        // 主光（暖金色，宴会顶光，高对比度持
        const mainLight = new THREE.SpotLight(0xffd890, 7.0, 55, Math.PI / 4.2, 0.28, 0.85);
        mainLight.position.set(0, 17, 9);
        mainLight.target.position.set(0, 1.8, 0);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.set(2048, 2048);
        mainLight.shadow.bias = -0.0008;
        mainLight.shadow.radius = 6;
        scene.add(mainLight); scene.add(mainLight.target);

        // 暖色轮廓光（背后，琥珀色）
        const rimLight = new THREE.DirectionalLight(0xd89040, 2.2);
        rimLight.position.set(-2, 10, -13);
        scene.add(rimLight);

        const rimLight2 = new THREE.DirectionalLight(0xc07030, 1.3);
        rimLight2.position.set(10, 7, -8);
        scene.add(rimLight2);

        // 暖色补光（前方，增强，照亮人物面部）
        const fillLight = new THREE.DirectionalLight(0xf0c890, 2.0);
        fillLight.position.set(0, 6, 14);
        scene.add(fillLight);

        // 面部专用补光（正前方偏上，柔和暖光，确保人物面部不黑持
        const faceFillLight = new THREE.SpotLight(0xffe0b0, 3.5, 30, Math.PI / 3.5, 0.5, 1.0);
        faceFillLight.position.set(0, 5, 12);
        faceFillLight.target.position.set(0, 1.2, 0);
        scene.add(faceFillLight); scene.add(faceFillLight.target);

        // 底部暖光（地面反射）
        const groundLight = new THREE.PointLight(0xd87030, 1.2, 20, 1.8);
        groundLight.position.set(0, 0.8, 6);
        scene.add(groundLight);

        // 两侧舞台聚光（暖琥珀持
        const spotL = new THREE.SpotLight(0xf5c070, 2.8, 35, Math.PI / 5.2, 0.4, 1.2);
        spotL.position.set(-11, 13, 11);
        spotL.target.position.set(-3.5, 1.8, 0);
        scene.add(spotL); scene.add(spotL.target);

        const spotR = new THREE.SpotLight(0xf5c070, 2.8, 35, Math.PI / 5.2, 0.4, 1.2);
        spotR.position.set(11, 13, 11);
        spotR.target.position.set(3.5, 1.8, 0);
        scene.add(spotR); scene.add(spotR.target);

        // ══════════════════════════════════════════════════
        //  宴会雅乐场景环境
        // ══════════════════════════════════════════════════

        // 地面（深色大理石，暖棕调持
        const groundGeo = new THREE.CircleGeometry(26, 72);
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x16100a, roughness: 0.35, metalness: 0.6,
            emissive: 0x0a0604, emissiveIntensity: 0.15,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.5;
        ground.receiveShadow = true;
        scene.add(ground);

        // 红毯（编钟下方，宴会感）
        const carpetGeo = new THREE.PlaneGeometry(14, 10);
        const carpetMat = new THREE.MeshStandardMaterial({
            color: 0x5a1010, roughness: 0.85, metalness: 0.05,
            emissive: 0x1a0404, emissiveIntensity: 0.2,
        });
        const carpet = new THREE.Mesh(carpetGeo, carpetMat);
        carpet.rotation.x = -Math.PI / 2;
        carpet.position.set(0, -0.48, 1);
        carpet.receiveShadow = true;
        scene.add(carpet);
        // 红毯金边
        const carpetBorderMat = new THREE.MeshStandardMaterial({ color: 0xc89848, metalness: 0.8, roughness: 0.35, emissive: 0x4a3010, emissiveIntensity: 0.3 });
        for (let side of [-1, 1]) {
            const border = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.02, 10), carpetBorderMat);
            border.position.set(side * 7, -0.46, 1);
            scene.add(border);
        }
        for (let side of [-1, 1]) {
            const border = new THREE.Mesh(new THREE.BoxGeometry(14, 0.02, 0.08), carpetBorderMat);
            border.position.set(0, -0.46, side * 5 + 1);
            scene.add(border);
        }
        // 红毯中心团纹
        const centerPatternMat = new THREE.MeshBasicMaterial({ color: 0xc89848, transparent: true, opacity: 0.25, side: THREE.DoubleSide });
        for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2;
            const petal = new THREE.Mesh(new THREE.CircleGeometry(0.4, 16), centerPatternMat);
            petal.position.set(Math.cos(angle)*0.5, -0.455, Math.sin(angle)*0.5 + 1);
            petal.rotation.x = -Math.PI / 2;
            scene.add(petal);
        }

        // 地面装饰持
        function createGroundPattern() {
            const group = new THREE.Group();
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x9a7a48, transparent: true, opacity: 0.18 });
            for (let r of [5, 6.8, 8.5]) {
                const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.018, 8, 144), ringMat);
                ring.rotation.x = Math.PI / 2;
                ring.position.y = -0.47;
                group.add(ring);
            }
            return group;
        }
        scene.add(createGroundPattern());

        // 展示台（深色金属基座，燕云风格）
        const podiumGeo = new THREE.CylinderGeometry(6.8, 7.2, 0.42, 72);
        const podiumMat = new THREE.MeshStandardMaterial({

        const podium = new THREE.Mesh(podiumGeo, podiumMat);
        podium.position.set(0, -0.29, 0);
        podium.receiveShadow = true; podium.castShadow = true;
        scene.add(podium);
        // 基座金边
        const podiumRing = new THREE.Mesh(

            new THREE.TorusGeometry(6.95, 0.04, 12, 144),
            new THREE.MeshStandardMaterial({ color: 0xa07838, metalness: 0.9, roughness: 0.3 })
        );
        podiumRing2.rotation.x = Math.PI / 2;
        podiumRing2.position.y = -0.48;
        scene.add(podiumRing2);

        // 水墨远山
        function createMountainLayer(z, color, opacity, scale) {
            const shape = new THREE.Shape();
            const w = 50 * scale;
            shape.moveTo(-w/2, 0);
            for (let i = 0; i <= 16; i++) {
                const px = -w/2 + (i / 16) * w;
                const ph = Math.sin(i * 0.95) * 3 * scale + Math.sin(i * 2.1) * 1.8 * scale + 4 * scale;
                shape.lineTo(px, Math.max(0.5, ph));
            }
            shape.lineTo(w/2, 0); shape.lineTo(-w/2, 0);
            const geo = new THREE.ShapeGeometry(shape);
            const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(0, -0.5, z);
            return mesh;
        }
        scene.add(createMountainLayer(-26, 0x14100a, 0.9, 1.5));
        scene.add(createMountainLayer(-20, 0x1a140c, 0.65, 1.2));
        scene.add(createMountainLayer(-14, 0x221a10, 0.35, 0.8));

        // ══════════════════════════════════════════════════
        //  宫殿场景结构
        // ══════════════════════════════════════════════════

        // 宫殿柱子（两侧，朱红漆金饰）
        function createPalacePillar(x, z, height = 6.5) {
            const group = new THREE.Group();
            const redMat = new THREE.MeshStandardMaterial({ color: 0x6a1818, roughness: 0.55, metalness: 0.15, emissive: 0x1a0404, emissiveIntensity: 0.12 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xc89848, metalness: 0.9, roughness: 0.28, emissive: 0x4a3010, emissiveIntensity: 0.2 });
            const darkWood = new THREE.MeshStandardMaterial({ color: 0x1a0e06, roughness: 0.7, metalness: 0.1 });

            const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, height, 16), redMat);
            pillar.position.y = height / 2;
            pillar.castShadow = true;
            group.add(pillar);

            // 柱基（石质）
            const base = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.48, 0.35, 16), new THREE.MeshStandardMaterial({ color: 0x3a3028, roughness: 0.6, metalness: 0.2 }));
            base.position.y = 0.175;
            base.castShadow = true;
            group.add(base);

            // 柱基金边
            const baseRing = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.03, 8, 20), goldMat);
            baseRing.position.y = 0.35;
            baseRing.rotation.x = Math.PI / 2;
            group.add(baseRing);

            // 柱头（斗拱简化）
            const capital = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.32, 0.25, 16), darkWood);
            capital.position.y = height + 0.125;
            capital.castShadow = true;
            group.add(capital);

            // 柱头金饰
            const capRing = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.025, 8, 20), goldMat);
            capRing.position.y = height + 0.25;
            capRing.rotation.x = Math.PI / 2;
            group.add(capRing);

            // 柱身金饰环（上下各一持
            for (let yRatio of [0.25, 0.75]) {
                const ring = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.018, 6, 18), goldMat);
                ring.position.y = height * yRatio;
                ring.rotation.x = Math.PI / 2;
                group.add(ring);
            }

            group.position.set(x, 0, z);
            return group;
        }

        // 放置宫殿柱子（前后两排，对称持
        const pillarPositions = [
            [-7.5, -5], [7.5, -5],
            [-7.5, 5], [7.5, 5],
            [-10, -2], [10, -2],
            [-10, 2], [10, 2],

        pillarPositions.forEach(([x, z]) => scene.add(createPalacePillar(x, z)));

        scene.add(createPalaceBeam(6.6, 5, 16));

        // 宫殿屋檐（顶部）
        function createPalaceRoof() {
            const group = new THREE.Group();
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x2a1810, roughness: 0.75, metalness: 0.08, side: THREE.DoubleSide });

            // 屋顶主体（梯形，用ShapeGeometry
            const roofShape = new THREE.Shape();
            roofShape.moveTo(-9, 0);
            roofShape.lineTo(9, 0);
            roofShape.lineTo(7, 1.2);
            roofShape.lineTo(-7, 1.2);
            roofShape.lineTo(-9, 0);
            const roofGeo = new THREE.ShapeGeometry(roofShape);
            const roofFront = new THREE.Mesh(roofGeo, roofMat);
            roofFront.position.set(0, 6.8, -5.3);
            roofFront.castShadow = true;
            group.add(roofFront);

            const roofBack = new THREE.Mesh(roofGeo, roofMat);
            roofBack.position.set(0, 6.8, 5.3);
            roofBack.rotation.y = Math.PI;
            group.add(roofBack);

            // 屋顶顶部（屋脊）
            const ridge = new THREE.Mesh(new THREE.BoxGeometry(14.5, 0.25, 10.8), tileMat);
            ridge.position.set(0, 8.1, 0);
            ridge.castShadow = true;
            group.add(ridge);

            // 屋脊金饰
            const ridgeGold = new THREE.Mesh(new THREE.BoxGeometry(14.8, 0.06, 11), goldMat);
            ridgeGold.position.set(0, 8.25, 0);
            group.add(ridgeGold);

            // 屋檐翘角（四角）
            for (let [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
                const corner = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.6, 4), tileMat);
                corner.position.set(sx * 8.8, 7.0, sz * 5.2);

                corner.rotation.x = sz * 0.3;

            for (let i = -8; i <= 8; i += 0.8) {

                tileLine.position.set(i, 7.4, 0);

        // 宫殿台阶（编钟前方）
        function createPalaceSteps() {
            const group = new THREE.Group();
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x2a221a, roughness: 0.65, metalness: 0.15 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xa07838, metalness: 0.85, roughness: 0.35 });

            // 三层台阶
            for (let i = 0; i < 3; i++) {
                const stepW = 10 - i * 0.8;
                const stepD = 2.5 - i * 0.3;
                const step = new THREE.Mesh(new THREE.BoxGeometry(stepW, 0.18, stepD), stoneMat);
                step.position.set(0, -0.41 + i * 0.18, 6.5 - i * 0.5);
                step.receiveShadow = true;
                step.castShadow = true;
                group.add(step);

                // 台阶金边
                const edge = new THREE.Mesh(new THREE.BoxGeometry(stepW + 0.05, 0.02, stepD + 0.05), goldMat);
                edge.position.set(0, -0.31 + i * 0.18, 6.5 - i * 0.5);

            }

            return group;

        // 精致六角宫灯（带骨架、灯罩、上下盖、流苏、灯穗、光晕）
        function createPalaceLantern(pos, scale = 1) {
            const group = new THREE.Group();
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x2a1808, metalness: 0.65, roughness: 0.4 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xc89848, metalness: 0.92, roughness: 0.25, emissive: 0x4a3010, emissiveIntensity: 0.25 });
            const shadeMat = new THREE.MeshStandardMaterial({
                color: 0xe85030, emissive: 0xe85030, emissiveIntensity: 0.65,
                transparent: true, opacity: 0.82, roughness: 0.45, side: THREE.DoubleSide,
            });

            // 灯杆
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.035*scale, 0.045*scale, 2.6*scale, 10), woodMat);
            pole.position.y = 1.3*scale; group.add(pole);
            // 灯杆装饰持
            for (let y of [0.6, 1.2, 1.8]) {
                const ring = new THREE.Mesh(new THREE.TorusGeometry(0.05*scale, 0.01*scale, 6, 12), goldMat);
                ring.position.y = y*scale; ring.rotation.x = Math.PI/2; group.add(ring);
            }
            // 底座
            const base1 = new THREE.Mesh(new THREE.CylinderGeometry(0.2*scale, 0.28*scale, 0.06*scale, 12), woodMat);
            base1.position.y = 0.03*scale; group.add(base1);
            const base2 = new THREE.Mesh(new THREE.CylinderGeometry(0.14*scale, 0.18*scale, 0.08*scale, 12), goldMat);
            base2.position.y = 0.1*scale; group.add(base2);

            // 灯体（六角形灯罩持
            const lanternH = 0.5*scale;
            const lanternR = 0.26*scale;
            const lantern = new THREE.Mesh(new THREE.CylinderGeometry(lanternR*0.9, lanternR, lanternH, 6, 1, true), shadeMat);
            lantern.position.y = 2.75*scale; group.add(lantern);

            // 灯罩骨架持根竖骨）
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2 + Math.PI/6;
                const rib = new THREE.Mesh(new THREE.CylinderGeometry(0.012*scale, 0.012*scale, lanternH*1.1, 4), goldMat);
                rib.position.set(Math.cos(angle)*lanternR*0.95, 2.75*scale, Math.sin(angle)*lanternR*0.95);
                group.add(rib);
            }
            // 上下横骨持
            const topRing = new THREE.Mesh(new THREE.TorusGeometry(lanternR*0.92, 0.015*scale, 6, 18), goldMat);
            topRing.position.y = 2.75*scale + lanternH/2; topRing.rotation.x = Math.PI/2; group.add(topRing);
            const botRing = new THREE.Mesh(new THREE.TorusGeometry(lanternR*0.95, 0.015*scale, 6, 18), goldMat);
            botRing.position.y = 2.75*scale - lanternH/2; botRing.rotation.x = Math.PI/2; group.add(botRing);

            // 灯顶（攒尖顶持
            const top = new THREE.Mesh(new THREE.ConeGeometry(lanternR*1.1, 0.18*scale, 6), woodMat);
            top.position.y = 2.75*scale + lanternH/2 + 0.09*scale; group.add(top);
            const topGold = new THREE.Mesh(new THREE.ConeGeometry(lanternR*0.6, 0.1*scale, 6), goldMat);
            topGold.position.y = 2.75*scale + lanternH/2 + 0.2*scale; group.add(topGold);
            // 顶珠
            const finial = new THREE.Mesh(new THREE.SphereGeometry(0.035*scale, 8, 6), goldMat);
            finial.position.y = 2.75*scale + lanternH/2 + 0.27*scale; group.add(finial);

            // 灯底
            const bottom = new THREE.Mesh(new THREE.CylinderGeometry(lanternR*0.85, lanternR*0.95, 0.06*scale, 6), woodMat);
            bottom.position.y = 2.75*scale - lanternH/2 - 0.03*scale; group.add(bottom);

            // 流苏（多层）
            const tasselMat = new THREE.MeshBasicMaterial({ color: 0xe8b040 });
            const tasselRed = new THREE.MeshBasicMaterial({ color: 0xc83028 });
            // 主流持
            const tassel = new THREE.Mesh(new THREE.CylinderGeometry(0.008*scale, 0.025*scale, 0.35*scale, 5), tasselMat);
            tassel.position.y = 2.75*scale - lanternH/2 - 0.25*scale; group.add(tassel);
            // 红色流苏持
            const knot = new THREE.Mesh(new THREE.SphereGeometry(0.04*scale, 8, 6), tasselRed);
            knot.position.y = 2.75*scale - lanternH/2 - 0.08*scale; group.add(knot);
            // 小流苏（两侧持
            for (let side of [-1, 1]) {
                const smallTassel = new THREE.Mesh(new THREE.CylinderGeometry(0.005*scale, 0.015*scale, 0.2*scale, 4), tasselMat);
                smallTassel.position.set(side*lanternR*0.7, 2.75*scale - lanternH/2 - 0.18*scale, 0);
                group.add(smallTassel);
            }

            // 光源（更亮，燕云风格暖光持
            const light = new THREE.PointLight(0xff9040, 3.2, 12, 1.6);
            light.position.y = 2.75*scale; group.add(light);
            // 内部强光
            const innerLight = new THREE.PointLight(0xffbb60, 2.0, 6, 1.8);
            innerLight.position.y = 2.75*scale; group.add(innerLight);

            // 光晕球（半透明发光球，更大更亮持
            const glowMat = new THREE.MeshBasicMaterial({ color: 0xffa050, transparent: true, opacity: 0.18, blending: THREE.AdditiveBlending, depthWrite: false });
            const glow = new THREE.Mesh(new THREE.SphereGeometry(lanternR*2.8, 16, 12), glowMat);
            glow.position.y = 2.75*scale; group.add(glow);

            group.userData = { light, innerLight, baseIntensity: 3.2, baseInner: 2.0, phase: Math.random()*Math.PI*2, glow };
            group.position.copy(pos);
            return group;
        }

        // 落地灯柱（多盏灯叠在一起，宴会感）
        function createLampPost(pos, scale = 1) {
            const group = new THREE.Group();
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x2a1808, metalness: 0.7, roughness: 0.4 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xc89848, metalness: 0.92, roughness: 0.25, emissive: 0x4a3010, emissiveIntensity: 0.2 });

            // 主杆
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05*scale, 0.07*scale, 3.2*scale, 12), poleMat);
            pole.position.y = 1.6*scale; group.add(pole);
            // 底座
            const base = new THREE.Mesh(new THREE.CylinderGeometry(0.25*scale, 0.35*scale, 0.1*scale, 12), goldMat);
            base.position.y = 0.05*scale; group.add(base);
            // 杆上装饰持
            for (let y of [0.8, 1.6, 2.4]) {
                const ring = new THREE.Mesh(new THREE.TorusGeometry(0.07*scale, 0.012*scale, 6, 14), goldMat);
                ring.position.y = y*scale; ring.rotation.x = Math.PI/2; group.add(ring);
            }
            // 顶部横杆（挂3盏灯持
            const crossBar = new THREE.Mesh(new THREE.CylinderGeometry(0.03*scale, 0.03*scale, 1.6*scale, 8), poleMat);
            crossBar.position.y = 3.1*scale; crossBar.rotation.z = Math.PI/2; group.add(crossBar);
            // 横杆装饰
            const centerOrnament = new THREE.Mesh(new THREE.SphereGeometry(0.08*scale, 10, 8), goldMat);
            centerOrnament.position.y = 3.1*scale; group.add(centerOrnament);

            // 盏小灯笼
            const lanternPositions = [-0.6, 0, 0.6];
            lanternPositions.forEach((lx, idx) => {
                const lanternGroup = new THREE.Group();
                const shadeMat = new THREE.MeshStandardMaterial({
                    color: 0xe85030, emissive: 0xe85030, emissiveIntensity: 0.6,
                    transparent: true, opacity: 0.8, roughness: 0.5,
                });
                // 绳子
                const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.008*scale, 0.008*scale, 0.35*scale, 4), new THREE.MeshBasicMaterial({color:0x3a2010}));
                rope.position.y = -0.17*scale; lanternGroup.add(rope);
                // 灯笼（椭圆）
                const lantern = new THREE.Mesh(new THREE.SphereGeometry(0.14*scale, 12, 10), shadeMat);
                lantern.position.y = -0.42*scale; lantern.scale.y = 1.2; lanternGroup.add(lantern);
                // 上下持
                const capTop = new THREE.Mesh(new THREE.CylinderGeometry(0.08*scale, 0.1*scale, 0.03*scale, 8), goldMat);
                capTop.position.y = -0.28*scale; lanternGroup.add(capTop);
                const capBot = new THREE.Mesh(new THREE.CylinderGeometry(0.1*scale, 0.08*scale, 0.03*scale, 8), goldMat);
                capBot.position.y = -0.56*scale; lanternGroup.add(capBot);
                // 流苏
                const tassel = new THREE.Mesh(new THREE.CylinderGeometry(0.005*scale, 0.015*scale, 0.18*scale, 4), new THREE.MeshBasicMaterial({color:0xe8b040}));
                tassel.position.y = -0.68*scale; lanternGroup.add(tassel);
                // 光源（更亮）
                const light = new THREE.PointLight(0xff9040, 1.8, 8, 1.8);
                light.position.y = -0.42*scale; lanternGroup.add(light);

                lanternGroup.position.set(lx*scale, 3.1*scale, 0);
                lanternGroup.userData = { light, baseIntensity: 1.8, phase: idx * 2 };
                group.add(lanternGroup);
            });

            group.position.copy(pos);
            return group;
        }

        const lanterns = [

        const lampPosts = [
            createLampPost(new THREE.Vector3(-9.5, 0, -1), 1.0),

        // 编钟架上方悬挂小灯笼持
        function createHangingLanterns() {
            const group = new THREE.Group();
            const shadeMat = new THREE.MeshStandardMaterial({
                color: 0xe04828, emissive: 0xe04828, emissiveIntensity: 0.55,
                transparent: true, opacity: 0.78, roughness: 0.5,
            });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xc89848, metalness: 0.9, roughness: 0.3 });
            const ropeMat = new THREE.MeshBasicMaterial({ color: 0x3a2010 });

            // 横杆
            const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 10, 8), new THREE.MeshStandardMaterial({color:0x2a1808, metalness:0.6, roughness:0.5}));
            bar.rotation.z = Math.PI/2;
            bar.position.y = 4.2;
            group.add(bar);

            // 盏小灯笼
            for (let i = 0; i < 8; i++) {
                const x = -4 + i * (8/7);
                const ropeLen = 0.3 + Math.sin(i * 0.8) * 0.1;
                const lg = new THREE.Group();
                const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, ropeLen, 4), ropeMat);
                rope.position.y = -ropeLen/2;
                lg.add(rope);
                const lantern = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 8), shadeMat);
                lantern.position.y = -ropeLen - 0.1;
                lantern.scale.y = 1.15;
                lg.add(lantern);
                const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.025, 8), goldMat);
                cap.position.y = -ropeLen + 0.01;
                lg.add(cap);
                const tassel = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.012, 0.14, 4), new THREE.MeshBasicMaterial({color:0xe8b040}));
                tassel.position.y = -ropeLen - 0.24;
                lg.add(tassel);
                const light = new THREE.PointLight(0xff8040, 1.2, 6, 1.8);
                light.position.y = -ropeLen - 0.1;
                lg.add(light);
                lg.userData = { light, baseIntensity: 1.2, phase: i * 0.7 };
                lg.position.x = x;
                group.add(lg);
            }
            return group;
        }
        const hangingLanterns = createHangingLanterns();
        scene.add(hangingLanterns);

        // ══════════════════════════════════════════════════
        //  宴会场景：屏风、案几、礼器、编磬、建鼓、华持

        // 大型山水屏风持扇折叠，背景处）
        function createScreen() {
            const group = new THREE.Group();
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x2a1808, metalness: 0.6, roughness: 0.5 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xa07838, metalness: 0.85, roughness: 0.35 });

            // 生成山水纹理
            function createLandscapeTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 768;
                const ctx = canvas.getContext('2d');
                // 底色（绢本）
                ctx.fillStyle = '#1a1820';
                ctx.fillRect(0, 0, 512, 768);
                // 远山
                ctx.fillStyle = 'rgba(60,70,90,0.4)';
                ctx.beginPath();
                ctx.moveTo(0, 400);
                for (let i = 0; i <= 10; i++) {
                    ctx.lineTo(i*51.2, 350 + Math.sin(i*1.2)*80 + Math.sin(i*2.5)*40);
                }
                ctx.lineTo(512, 768); ctx.lineTo(0, 768); ctx.fill();
                // 中山
                ctx.fillStyle = 'rgba(40,50,70,0.6)';
                ctx.beginPath();
                ctx.moveTo(0, 500);
                for (let i = 0; i <= 12; i++) {
                    ctx.lineTo(i*42.7, 450 + Math.sin(i*1.5)*60 + Math.cos(i*2)*30);
                }
                ctx.lineTo(512, 768); ctx.lineTo(0, 768); ctx.fill();
                // 近山
                ctx.fillStyle = 'rgba(25,30,45,0.8)';
                ctx.beginPath();
                ctx.moveTo(0, 600);
                for (let i = 0; i <= 14; i++) {
                    ctx.lineTo(i*36.6, 560 + Math.sin(i*1.8)*50 + Math.sin(i*3)*25);
                }
                ctx.lineTo(512, 768); ctx.lineTo(0, 768); ctx.fill();
                // 松树（简化）
                ctx.strokeStyle = 'rgba(20,25,35,0.9)';
                ctx.lineWidth = 3;
                for (let i = 0; i < 5; i++) {
                    const tx = 60 + i * 100;
                    const ty = 580 + Math.sin(i)*30;
                    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx, ty-60); ctx.stroke();
                    for (let j = 0; j < 4; j++) {
                        ctx.beginPath();
                        ctx.moveTo(tx, ty - 15 - j*12);
                        ctx.lineTo(tx - 20 + j*3, ty - 25 - j*12);
                        ctx.moveTo(tx, ty - 15 - j*12);
                        ctx.lineTo(tx + 20 - j*3, ty - 25 - j*12);
                        ctx.stroke();
                    }
                }
                // 瀑布
                ctx.strokeStyle = 'rgba(120,140,170,0.3)';
                ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(256, 380); ctx.lineTo(256, 520); ctx.stroke();
                // 题字
                ctx.fillStyle = 'rgba(180,150,100,0.35)';
                ctx.font = 'bold 28px "Ma Shan Zheng", serif';
                ctx.textAlign = 'center';
                ctx.fillText('高山流水', 420, 120);
                ctx.font = '14px "Ma Shan Zheng", serif';
                ctx.fillText('雅乐', 440, 160);
                // 印章
                ctx.fillStyle = 'rgba(180,50,40,0.4)';
                ctx.fillRect(430, 180, 36, 36);
                ctx.fillStyle = 'rgba(220,180,120,0.6)';
                ctx.font = 'bold 14px serif';
                ctx.fillText('—', 448, 205);

                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
            }

            const landscapeTex = createLandscapeTexture();
            const screenMat = new THREE.MeshStandardMaterial({
                map: landscapeTex, transparent: true, opacity: 0.9,
                roughness: 0.8, metalness: 0.05, side: THREE.DoubleSide,
                emissive: 0x0a0c12, emissiveIntensity: 0.3,
            });

            // 4扇屏持
            const panelW = 2.2, panelH = 4.5;
            const angles = [0.12, 0.04, -0.04, -0.12];
            const offsets = [-3.3, -1.1, 1.1, 3.3];
            for (let i = 0; i < 4; i++) {
                const panelGroup = new THREE.Group();
                // 屏面
                const panel = new THREE.Mesh(new THREE.PlaneGeometry(panelW, panelH), screenMat);
                panel.position.y = panelH/2;
                panelGroup.add(panel);
                // 边框
                const frameTop = new THREE.Mesh(new THREE.BoxGeometry(panelW+0.1, 0.08, 0.06), frameMat);
                frameTop.position.y = panelH + 0.04; panelGroup.add(frameTop);
                const frameBot = new THREE.Mesh(new THREE.BoxGeometry(panelW+0.1, 0.12, 0.06), frameMat);
                frameBot.position.y = -0.06; panelGroup.add(frameBot);
                const frameL = new THREE.Mesh(new THREE.BoxGeometry(0.06, panelH+0.1, 0.06), frameMat);
                frameL.position.set(-panelW/2 - 0.03, panelH/2, 0); panelGroup.add(frameL);
                const frameR = new THREE.Mesh(new THREE.BoxGeometry(0.06, panelH+0.1, 0.06), frameMat);
                frameR.position.set(panelW/2 + 0.03, panelH/2, 0); panelGroup.add(frameR);
                // 金色装饰持
                for (let [cx, cy] of [[-panelW/2, panelH], [panelW/2, panelH], [-panelW/2, 0], [panelW/2, 0]]) {
                    const corner = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.08), goldMat);
                    corner.position.set(cx, cy, 0.02); panelGroup.add(corner);
                }
                // 底座
                const base = new THREE.Mesh(new THREE.BoxGeometry(panelW*0.3, 0.15, 0.2), frameMat);
                base.position.y = -0.12; panelGroup.add(base);

                panelGroup.position.set(offsets[i], 0, -7.5);
                panelGroup.rotation.y = angles[i];
                group.add(panelGroup);
            }
            return group;
        }
        scene.add(createScreen());

        // 案几（两侧，放礼器）
        function createTable(pos, rotY) {
            const group = new THREE.Group();
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x1a0e06, roughness: 0.6, metalness: 0.2 });
            const redMat = new THREE.MeshStandardMaterial({ color: 0x4a1010, roughness: 0.7, metalness: 0.1, emissive: 0x1a0404, emissiveIntensity: 0.15 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xa07838, metalness: 0.85, roughness: 0.35 });

            // 桌面
            const top = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.08, 0.7), woodMat);
            top.position.y = 0.75; top.castShadow = true; top.receiveShadow = true;
            group.add(top);
            // 桌面红漆持
            const edge = new THREE.Mesh(new THREE.BoxGeometry(2.02, 0.02, 0.72), redMat);
            edge.position.y = 0.8; group.add(edge);
            // 桌面金边
            const goldEdge = new THREE.Mesh(new THREE.BoxGeometry(2.04, 0.015, 0.74), goldMat);
            goldEdge.position.y = 0.815; group.add(goldEdge);
            // 桌腿持根，弯曲感）
            for (let [lx, lz] of [[-0.85, -0.25], [0.85, -0.25], [-0.85, 0.25], [0.85, 0.25]]) {
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.75, 8), woodMat);
                leg.position.set(lx, 0.375, lz); leg.castShadow = true;
                group.add(leg);
                // 腿足金色装饰
                const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.04, 8), goldMat);
                foot.position.set(lx, 0.02, lz); group.add(foot);
            }
            // 横撑
            const stretcher = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.04, 0.04), woodMat);
            stretcher.position.y = 0.3; group.add(stretcher);

            group.position.copy(pos);
            group.rotation.y = rotY;
            return group;
        }

        // 青铜礼器（鼎持
        function createDing(pos, scale = 1) {
            const group = new THREE.Group();
            const bronzeMat = new THREE.MeshStandardMaterial({ color: 0x4a3828, metalness: 0.85, roughness: 0.35, emissive: 0x1a1008, emissiveIntensity: 0.15 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x2a1e14, metalness: 0.8, roughness: 0.4 });

            // 鼎身
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.22*scale, 0.18*scale, 0.25*scale, 16), bronzeMat);
            body.position.y = 0.2*scale; body.castShadow = true; group.add(body);
            // 鼎口持
            const rim = new THREE.Mesh(new THREE.TorusGeometry(0.22*scale, 0.025*scale, 8, 20), bronzeMat);
            rim.position.y = 0.33*scale; rim.rotation.x = Math.PI/2; group.add(rim);
            // 鼎耳（2只）
            for (let side of [-1, 1]) {
                const ear = new THREE.Mesh(new THREE.TorusGeometry(0.08*scale, 0.02*scale, 6, 12, Math.PI), bronzeMat);
                ear.position.set(side*0.18*scale, 0.38*scale, 0);
                ear.rotation.z = side * Math.PI/2;
                group.add(ear);
            }
            // 鼎足持只）
            for (let i = 0; i < 3; i++) {
                const angle = (i / 3) * Math.PI * 2;
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03*scale, 0.05*scale, 0.2*scale, 8), darkMat);
                leg.position.set(Math.cos(angle)*0.13*scale, 0.08*scale, Math.sin(angle)*0.13*scale);
                leg.castShadow = true; group.add(leg);
            }
            // 纹饰（简单凸起）
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const deco = new THREE.Mesh(new THREE.SphereGeometry(0.015*scale, 5, 4), darkMat);
                deco.position.set(Math.cos(angle)*0.2*scale, 0.22*scale, Math.sin(angle)*0.2*scale);
                group.add(deco);
            }
            group.position.copy(pos);
            return group;
        }

        // 青铜尊（酒器持
        function createZun(pos, scale = 1) {
            const group = new THREE.Group();
            const bronzeMat = new THREE.MeshStandardMaterial({ color: 0x5a4530, metalness: 0.85, roughness: 0.32 });
            // 尊身（喇叭口持
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.18*scale, 0.12*scale, 0.3*scale, 16), bronzeMat);
            body.position.y = 0.2*scale; body.castShadow = true; group.add(body);
            // 高圈持
            const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.14*scale, 0.16*scale, 0.1*scale, 16), bronzeMat);
            foot.position.y = 0.05*scale; group.add(foot);
            // 口沿
            const rim = new THREE.Mesh(new THREE.TorusGeometry(0.18*scale, 0.015*scale, 6, 18), bronzeMat);
            rim.position.y = 0.36*scale; rim.rotation.x = Math.PI/2; group.add(rim);
            // 扉棱持条竖棱）
            for (let i = 0; i < 4; i++) {
                const angle = (i/4)*Math.PI*2;
                const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.015*scale, 0.25*scale, 0.03*scale), new THREE.MeshStandardMaterial({color:0x3a2a1a, metalness:0.8, roughness:0.4}));
                ridge.position.set(Math.cos(angle)*0.15*scale, 0.2*scale, Math.sin(angle)*0.15*scale);
                ridge.rotation.y = angle;
                group.add(ridge);
            }
            group.position.copy(pos);
            return group;
        }

        // 放置案几和礼器（对称布局持
        const tables = [
            { pos: new THREE.Vector3(-7.5, 0, 4.5), rot: 0.3 },
            { pos: new THREE.Vector3(7.5, 0, 4.5), rot: -0.3 },
            { pos: new THREE.Vector3(-8.5, 0, 0.5), rot: 0.15 },

        });

        // 编磬（右侧，与编钟对称，雅乐必备持
        function createBianqing() {
            const group = new THREE.Group();
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x3a4050, roughness: 0.4, metalness: 0.3, emissive: 0x0a0c12, emissiveIntensity: 0.1 });
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x1a0e06, roughness: 0.7, metalness: 0.15 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xa07838, metalness: 0.85, roughness: 0.35 });
            const ropeMat = new THREE.MeshBasicMaterial({ color: 0x5a3020 });

            // 支架（两层横梁）
            const post1 = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 2.2, 8), woodMat);
            post1.position.set(-1.2, 1.1, 0); post1.castShadow = true; group.add(post1);
            const post2 = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 2.2, 8), woodMat);
            post2.position.set(1.2, 1.1, 0); post2.castShadow = true; group.add(post2);
            // 横梁
            const beam1 = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.08, 0.12), woodMat);
            beam1.position.y = 1.8; group.add(beam1);
            const beam2 = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.08, 0.12), woodMat);
            beam2.position.y = 1.0; group.add(beam2);
            // 横梁金饰
            for (let y of [1.8, 1.0]) {
                const goldBand = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.02, 0.14), goldMat);
                goldBand.position.y = y + 0.04; group.add(goldBand);
            }
            // 底座
            for (let x of [-1.2, 1.2]) {
                const base = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.08, 0.25), woodMat);
                base.position.set(x, 0.04, 0); group.add(base);
            }

            // 磬片（L形石片，16片，分两层）
            const qingCount = 16;
            for (let i = 0; i < qingCount; i++) {
                const layer = i < 8 ? 0 : 1;
                const idx = layer === 0 ? i : i - 8;
                const size = 0.35 - idx * 0.02;
                const y = layer === 0 ? 1.55 : 0.75;
                const x = -1.0 + idx * (2.0/7);
                // 绳子
                const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.2, 4), ropeMat);
                rope.position.set(x, y - 0.1, 0); group.add(rope);
                // 磬片（L形，用两个盒子组合）
                const qingGroup = new THREE.Group();
                const part1 = new THREE.Mesh(new THREE.BoxGeometry(size*0.7, size*0.12, 0.04), stoneMat);
                part1.position.x = -size*0.1; qingGroup.add(part1);
                const part2 = new THREE.Mesh(new THREE.BoxGeometry(size*0.12, size*0.5, 0.04), stoneMat);
                part2.position.set(size*0.25, -size*0.19, 0); qingGroup.add(part2);
                // 磬孔
                const hole = new THREE.Mesh(new THREE.CircleGeometry(0.015, 8), new THREE.MeshBasicMaterial({color:0x0a0c12}));
                hole.position.set(-size*0.2, size*0.02, 0.025); qingGroup.add(hole);

                qingGroup.position.set(x, y - 0.2 - size*0.15, 0);
                qingGroup.rotation.z = -0.1 + idx * 0.01;
                qingGroup.castShadow = true;
                group.add(qingGroup);
            }

            return group;
        }
        const bianqing = createBianqing();
        bianqing.position.set(9.5, 0, -1);
        bianqing.rotation.y = -0.3;
        scene.add(bianqing);

        // 建鼓（大型鼓，雅乐必备）
        function createJianGu() {
            const group = new THREE.Group();
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x2a1008, roughness: 0.6, metalness: 0.2 });
            const leatherMat = new THREE.MeshStandardMaterial({ color: 0x6a4028, roughness: 0.8, metalness: 0.05 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xa07838, metalness: 0.85, roughness: 0.35 });
            const redMat = new THREE.MeshStandardMaterial({ color: 0x6a1818, roughness: 0.7, metalness: 0.1, emissive: 0x2a0404, emissiveIntensity: 0.2 });

            // 鼓座（青铜猛兽形，简化为圆形底座持
            const base = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 0.2, 16), goldMat);
            base.position.y = 0.1; base.castShadow = true; group.add(base);
            const baseTop = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.45, 0.1, 16), woodMat);
            baseTop.position.y = 0.25; group.add(baseTop);
            // 立柱（穿鼓而过持
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 3.0, 10), woodMat);
            pole.position.y = 1.7; pole.castShadow = true; group.add(pole);
            // 柱顶装饰（羽持华盖持
            const topOrnament = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.3, 8), redMat);
            topOrnament.position.y = 3.3; group.add(topOrnament);
            const topBall = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 8), goldMat);
            topBall.position.y = 3.5; group.add(topBall);
            // 柱上金色装饰持
            for (let y of [0.8, 2.6]) {
                const ring = new THREE.Mesh(new THREE.TorusGeometry(0.08, 0.015, 6, 14), goldMat);
                ring.position.y = y; ring.rotation.x = Math.PI/2; group.add(ring);
            }
            // 鼓身
            const drumBody = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.7, 24), woodMat);
            drumBody.position.y = 1.7; drumBody.rotation.x = Math.PI/2; drumBody.castShadow = true;
            group.add(drumBody);
            // 鼓面（两面）
            for (let side of [-1, 1]) {
                const face = new THREE.Mesh(new THREE.CircleGeometry(0.52, 24), leatherMat);
                face.position.set(side * 0.36, 1.7, 0);
                face.rotation.y = side * Math.PI/2;
                group.add(face);
                // 鼓面装饰（同心圆持
                for (let r of [0.15, 0.3, 0.45]) {
                    const decoRing = new THREE.Mesh(new THREE.TorusGeometry(r, 0.008, 6, 24), goldMat);
                    decoRing.position.set(side * 0.365, 1.7, 0);
                    decoRing.rotation.y = side * Math.PI/2;
                    group.add(decoRing);
                }
            }
            // 鼓身红漆装饰持
            const redBand1 = new THREE.Mesh(new THREE.TorusGeometry(0.56, 0.03, 8, 28), redMat);
            redBand1.position.set(0, 1.7, 0); redBand1.rotation.x = Math.PI/2; group.add(redBand1);
            // 鼓槌持根，靠在鼓旁持
            for (let side of [-1, 1]) {
                const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.025, 0.6, 6), woodMat);
                stick.position.set(side * 0.7, 1.4, 0.3);
                stick.rotation.z = side * 0.3;
                stick.rotation.x = 0.2;
                group.add(stick);
            }
            return group;
        }
        const jianGu = createJianGu();
        jianGu.position.set(-9.5, 0, -1);
        jianGu.rotation.y = 0.3;
        scene.add(jianGu);

        // 瑟（古代弦乐器，25弦）
        function createSe(pos, rotY) {
            const group = new THREE.Group();
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x2a1808, roughness: 0.6, metalness: 0.15 });
            const darkWood = new THREE.MeshStandardMaterial({ color: 0x1a0e04, roughness: 0.7, metalness: 0.1 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xa07838, metalness: 0.85, roughness: 0.35 });
            const stringMat = new THREE.MeshBasicMaterial({ color: 0xe8d8b8 });

            // 瑟身（长条形，微弧）
            const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.12, 0.55), woodMat);
            body.position.y = 0.4; body.castShadow = true; body.receiveShadow = true; group.add(body);
            // 面板（微凸）
            const top = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 3.2, 16, 1, false, 0, Math.PI), darkWood);
            top.rotation.z = Math.PI / 2; top.rotation.x = Math.PI; top.position.y = 0.46; group.add(top);
            // 首尾装饰

        // 竽（古代管乐器，36簧管持
        function createYu(pos, rotY) {
            const group = new THREE.Group();
            const bambooMat = new THREE.MeshStandardMaterial({ color: 0x6a5030, roughness: 0.7, metalness: 0.1 });
            const darkBamboo = new THREE.MeshStandardMaterial({ color: 0x4a3820, roughness: 0.75, metalness: 0.1 });

            // 匏斗（底座）
            const base = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 12), darkBamboo);
            base.scale.y = 0.7; base.position.y = 0.25; base.castShadow = true; group.add(base);
            // 底座金边
            const baseRing = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.015, 6, 16), goldMat);
            baseRing.position.y = 0.35; baseRing.rotation.x = Math.PI / 2; group.add(baseRing);
            // 吹口
            const mouthpiece = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.3, 8), bambooMat);
            mouthpiece.position.set(0, 0.55, -0.15); mouthpiece.rotation.x = 0.4; group.add(mouthpiece);
            // 36根簧管（分前后两排，高低错落持
            const tubeCount = 18;
            for (let row = 0; row < 2; row++) {
                for (let i = 0; i < tubeCount; i++) {
                    const angle = (i / tubeCount) * Math.PI * 0.8 - Math.PI * 0.4;
                    const radius = 0.08 + row * 0.06;
                    const x = Math.sin(angle) * radius;
                    const z = Math.cos(angle) * radius * 0.6 + 0.05;
                    const height = 0.5 + Math.abs(Math.sin(angle)) * 0.8 + row * 0.15 + (i % 3) * 0.08;
                    const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.022, height, 6), row === 0 ? bambooMat : darkBamboo);
                    tube.position.set(x, 0.35 + height / 2, z); tube.castShadow = true; group.add(tube);
                    // 竹节
                    for (let j = 1; j < Math.floor(height / 0.2); j++) {
                        const node = new THREE.Mesh(new THREE.TorusGeometry(0.02, 0.003, 4, 8), darkBamboo);
                        node.position.set(x, 0.35 + j * 0.2, z); node.rotation.x = Math.PI / 2; group.add(node);
                    }
                    // 管口（金色装饰）
                    const topRing = new THREE.Mesh(new THREE.TorusGeometry(0.018, 0.004, 4, 8), goldMat);
                    topRing.position.set(x, 0.35 + height, z); topRing.rotation.x = Math.PI / 2; group.add(topRing);
                    // 簧舌
                    const reed = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.04, 0.015), reedMat);
                    reed.position.set(x, 0.38, z + 0.015); group.add(reed);
                }
            }
            // 底座支架
            const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.2, 8), darkBamboo);
            stand.position.y = 0.1; group.add(stand);
            const standBase = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.18, 0.04, 10), goldMat);
            standBase.position.y = 0.02; group.add(standBase);
            group.position.copy(pos); group.rotation.y = rotY;
            return group;
        }

        const LAYER_CONFIGS = [

                const freq = 105 * Math.pow(2, (1 - (size - layer.sizeMin) / (layer.sizeMax - layer.sizeMin)) * 4.6 + layerIdx * 0.35);

        function generateBronzeTexture(seed, baseColor, bellType) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const c = new THREE.Color(baseColor);
            const hsl = c.getHSL({});
            ctx.fillStyle = `hsl(${hsl.h*360}, ${hsl.s*100}%, ${hsl.l*100}%)`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const rng = (s) => { let x = Math.sin(s + seed) * 43758.5453; return x - Math.floor(x); };
            for (let i = 0; i < 140; i++) {
                const x = rng(i*3+1) * canvas.width;
                const y = rng(i*3+2) * canvas.height;
                const radius = 3 + rng(i*3+3) * 22;
                const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
                const rustHue = 0.24 + rng(i*3+4) * 0.16;
                g.addColorStop(0, `hsla(${rustHue*360}, 55%, 38%, ${0.28+rng(i*3+5)*0.4})`);
                g.addColorStop(1, 'transparent');
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI*2); ctx.fill();
            }
            for (let i = 0; i < 50; i++) {
                const x = rng(i*11+100) * canvas.width;
                const y = rng(i*11+101) * canvas.height;
                const radius = 2 + rng(i*11+102) * 10;
                const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
                g.addColorStop(0, `hsla(200, 50%, 40%, ${0.2+rng(i*11+103)*0.25})`);
                g.addColorStop(1, 'transparent');
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI*2); ctx.fill();
            }
            for (let i = 0; i < 60; i++) {
                const x = rng(i*7+10) * canvas.width;
                const y = rng(i*7+11) * canvas.height;
                const radius = 2 + rng(i*7+12) * 9;
                ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI*2);
                ctx.fillStyle = `hsla(42, 70%, 60%, ${0.18+rng(i*7+13)*0.28})`;
                ctx.fill();
            }
            function drawPatternBand(y, height, patternType) {
                ctx.save();
                ctx.beginPath(); ctx.rect(0, y, canvas.width, height); ctx.clip();
                const count = 8;
                for (let i = 0; i < count; i++) {
                    const bx = (i / count) * canvas.width;
                    const bw = canvas.width / count;
                    ctx.strokeStyle = `hsla(40, 55%, 65%, 0.4)`;
                    ctx.lineWidth = 1.3;
                    if (patternType === 'cloud') {
                        ctx.beginPath();
                        for (let j = 0; j < 3; j++) {
                            const cy = y + height * (0.3 + j * 0.25);
                            ctx.moveTo(bx + 2, cy);
                            ctx.bezierCurveTo(bx+bw*0.3, cy-7, bx+bw*0.5, cy+7, bx+bw*0.7, cy);
                            ctx.bezierCurveTo(bx+bw*0.85, cy-5, bx+bw*0.95, cy+4, bx+bw-2, cy);
                        }
                        ctx.stroke();
                    } else {
                        ctx.beginPath();
                        const cy = y + height / 2;

        function createBellGeometry(rx, rz, height, isBo) {
            const geo = new THREE.CylinderGeometry(rx * 0.58, rx * 0.96, height, 48, 24);
            const pos = geo.attributes.position;
            const v = new THREE.Vector3();
            for (let i = 0; i < pos.count; i++) {
                v.fromBufferAttribute(pos, i);
                const theta = Math.atan2(v.z, v.x);
                const r = Math.sqrt(v.x * v.x + v.z * v.z);
                if (r < 0.001) continue;
                const t = (v.y / height) + 0.5;
                const ellipseX = 1.0 + 0.38 * t;
                const ellipseZ = 0.62 - 0.16 * t;
                const heightFactor = 1.0 - 0.11 * t;
                let mouthCurve = 1.0;
                if (t < 0.08) {
                    const mt = t / 0.08;
                    mouthCurve = 0.91 + 0.09 * Math.sin(mt * Math.PI);
                }
                const newR = r * heightFactor * mouthCurve;
                const newX = newR * ellipseX * Math.cos(theta);
                const newZ = newR * ellipseZ * Math.sin(theta);
                let newY = v.y;
                if (t < 0.06 && !isBo) {
                    const edgeFactor = Math.abs(Math.cos(theta));
                    newY = v.y + (1 - edgeFactor) * height * 0.045;
                }
                pos.setXYZ(i, newX, newY, newZ);
            }
            pos.needsUpdate = true;
            geo.computeVertexNormals();
            return geo;
        }

        function createBell(bellData) {

                const baseRing = new THREE.Mesh(new THREE.TorusGeometry(rx*0.21, rx*0.015, 6, 16), darkMat);

                const xuanPositions = [0.12, 0.22, 0.32];

                    const xuan = new THREE.Mesh(new THREE.TorusGeometry(rx*(0.13+idx*0.01), rx*0.018, 6, 18), idx%2 ? darkMat : midMat);
                    xuan.position.y = h / 2 + h * ratio; xuan.rotation.x = Math.PI / 2; mesh.add(xuan);
                });
                const wo = new THREE.Mesh(new THREE.TorusGeometry(rx*0.17, rx*0.032, 6, 18), knobMat);
                wo.position.set(rx*0.15, h/2 + h*0.3, 0); wo.rotation.y = Math.PI / 2; wo.castShadow = true; mesh.add(wo);
                const heng = new THREE.Mesh(new THREE.CylinderGeometry(rx*0.14, rx*0.14, h*0.035, 14), darkMat);

                hengTop.position.y = h / 2 + h * 0.41; mesh.add(hengTop);

            const meiMat = new THREE.MeshStandardMaterial({ color: bronzeLight, metalness: 0.86, roughness: 0.28, emissive: new THREE.Color(color).multiplyScalar(0.03) });
            const meiBaseMat = new THREE.MeshStandardMaterial({ color: bronzeDark, metalness: 0.8, roughness: 0.4 });
            const zones = [];
            for (let side of [1, -1]) for (let xZone of [-1, 1]) zones.push({ zSide: side, xSide: xZone });
            zones.forEach(zone => {
                for (let row = 0; row < 3; row++) {
                    for (let col = 0; col < 3; col++) {

                        const ellipseZ = 0.62 - 0.16 * t;

                        const meiTop = new THREE.Mesh(new THREE.SphereGeometry(meiSize * 0.55, 8, 6), meiMat);
                        meiTop.position.set(xPos, yPos, zPos); meiTop.translateY(meiSize * 0.9); meiTop.castShadow = true; mesh.add(meiTop);

            const rimMat = new THREE.MeshStandardMaterial({ color: bronzeDark, metalness: 0.8, roughness: 0.36 });
            if (isBo) {
                const rim = new THREE.Mesh(new THREE.TorusGeometry(rx * 0.93, rx * 0.045, 10, 36), rimMat);
                rim.position.y = -h / 2; rim.rotation.x = Math.PI / 2; rim.scale.z = rz / rx * 0.95; rim.castShadow = true; mesh.add(rim);
                for (let i = 0; i < 12; i++) {

        const bellMeshes = [];

                    const tail = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);

                {f:N.A4,d:0.5},{f:N.G4,d:0.5},
                {f:N.A4,d:0.4},{f:N.C5,d:0.3},{f:N.D5,d:0.4},{f:N.E5,d:0.3},
                {f:N.G5,d:0.6},{f:N.REST,d:0.2},
                {f:N.E5,d:0.4},{f:N.D5,d:0.3},{f:N.C5,d:0.4},{f:N.A4,d:0.3},
                {f:N.G4,d:0.5},{f:N.A4,d:0.5},
                {f:N.C5,d:0.4},{f:N.D5,d:0.3},{f:N.E5,d:0.4},{f:N.G5,d:0.3},
                {f:N.A5,d:0.4},{f:N.G5,d:0.4},{f:N.E5,d:0.8},
                {f:N.D5,d:0.4},{f:N.C5,d:0.3},{f:N.A4,d:0.4},{f:N.G4,d:0.3},
                {f:N.E4,d:0.5},{f:N.D4,d:0.5},
                {f:N.C5,d:0.6},{f:N.REST,d:0.4},
            ]},
        ];
        let currentSongIndex = 0, isPlaying = false, currentNoteIndex = 0, timeoutId = null, activeHighlightBell = null;
        function findClosestBell(freq) {
            if (freq === 0) return null;
            let closest = null, minDiff = Infinity;
            for (const bell of bellMeshes) { const diff = Math.abs(bell.userData.freq - freq); if (diff < minDiff) { minDiff = diff; closest = bell; } }
            return closest;
        }
        function highlightBell(bell) {
            if (activeHighlightBell && activeHighlightBell !== bell) {
                const mat = activeHighlightBell.material;
                if (Array.isArray(mat)) mat.forEach(m => m.emissiveIntensity = 0.12); else mat.emissiveIntensity = 0.12;
            }
            if (bell) {
                const mat = bell.material;
                if (Array.isArray(mat)) mat.forEach(m => m.emissiveIntensity = 1.4); else mat.emissiveIntensity = 1.4;
                activeHighlightBell = bell;
            } else activeHighlightBell = null;
        }
        function getCurrentSong() { return songs[currentSongIndex]; }
        function playNote(index) {
            const song = getCurrentSong();
            if (index >= song.notes.length) { stopPlayback(); return; }
            const note = song.notes[index];
            // 力度变化：根据乐句位置和音符时长调整音量
            const phrasePos = (index % 8) / 8;
            const phraseAccent = 0.85 + Math.sin(phrasePos * Math.PI * 2) * 0.15;
            const durationAccent = note.d > 0.5 ? 1.15 : 1.0;
            const velocity = phraseAccent * durationAccent;
            if (note.f > 0) {
                const bell = findClosestBell(note.f);
                if (bell) {
                    const data = bell.userData.bellData;
                    const vol = (0.22 + (data.size - 0.2) * 0.32) * velocity;
                    playBellSound(note.f, Math.min(vol, 0.75), note.d * 1.8, data.size);
                    highlightBell(bell);
                    infoName.textContent = `🎵 ${data.name}`; infoDetail.textContent = `自动演奏 · ${song.name} · ${data.detail}`;
                    infoPitch.textContent = `音高：${note.f.toFixed(1)} Hz · 力度：${Math.round(velocity * 100)}%`;
                    bell.rotation.z = 0.028 * velocity;
                    setTimeout(() => { bell.rotation.z = -0.014 * velocity; }, 70);
                    setTimeout(() => { bell.rotation.z = 0; }, 160);
                }
            } else highlightBell(null);
            progressBar.style.width = `${((index + 1) / song.notes.length) * 100}%`;
            progressText.textContent = `${index + 1}/${song.notes.length}`;
            timeoutId = setTimeout(() => playNote(index + 1), note.d * 1000);
        }
        function startPlayback() {
            if (isPlaying) return; initAudio(); isPlaying = true; currentNoteIndex = 0;
            playBtn.textContent = '—'; progressBar.style.width = '0%';
            progressText.textContent = `0/${getCurrentSong().notes.length}`; playNote(0);
        }
        function pausePlayback() {
            if (!isPlaying) return; isPlaying = false;
            if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
            playBtn.textContent = '—'; highlightBell(null);
        }
        function stopPlayback() {
            isPlaying = false;
            if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
            playBtn.textContent = '—'; highlightBell(null);
            const song = getCurrentSong();
            progressBar.style.width = '100%'; progressText.textContent = `${song.notes.length}/${song.notes.length}`;
            setTimeout(() => {
                if (!isPlaying) { infoName.textContent = '🎵 点击编钟演奏'; infoDetail.textContent = '曾侯乙墓出土 · 全套65件'; infoPitch.textContent = '🖱 拖动旋转 · 滚轮缩放 · 拉近隐藏简介'; }
            }, 700);
        }
        function togglePlay() {
            if (isPlaying) pausePlayback();
            else { if (currentNoteIndex >= getCurrentSong().notes.length) { currentNoteIndex = 0; progressBar.style.width = '0%'; } startPlayback(); }
        }
        playBtn.addEventListener('click', togglePlay);
        songSelector.addEventListener('click', (e) => {
            const btn = e.target.closest('.song-btn'); if (!btn) return;
            const idx = parseInt(btn.dataset.song); if (idx === currentSongIndex) return;
            if (isPlaying) pausePlayback();
            currentSongIndex = idx; currentNoteIndex = 0;
            document.querySelectorAll('.song-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            progressBar.style.width = '0%';
            const song = getCurrentSong(); progressText.textContent = `0/${song.notes.length}`;
            infoName.textContent = `🎵 曲目：${song.name}`; infoDetail.textContent = `点击播放按钮开始演奏`;
            infoPitch.textContent = `${song.notes.length} 个音符`;
        });
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
            const key = e.key.toLowerCase();
            // 键盘自由演奏
            if (keyboardMap[key] && !e.ctrlKey && !e.metaKey && !e.altKey) {
                if (!pressedKeys.has(key)) {
                    pressedKeys.add(key);
                    initAudio();
                    playKeyboardNote(keyboardMap[key]);
                }
                return;
            }
            if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); togglePlay(); }
            else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault(); controls.autoRotate = !controls.autoRotate;
                infoPitch.textContent = controls.autoRotate ? '🔄 自动旋转开启' : '⏸ 自动旋转暂停';
                setTimeout(() => {
                    if (selectedBell && !isPlaying) infoPitch.textContent = `音高：${selectedBell.userData.freq.toFixed(1)} Hz`;
                    else if (!isPlaying) infoPitch.textContent = '🖱 拖动旋转 · 滚轮缩放 · 拉近隐藏简介';
                }, 1800);
            } else if (e.key >= '1' && e.key <= '6') {
                const idx = parseInt(e.key) - 1;
                if (idx < songs.length) { const btn = document.querySelector(`.song-btn[data-song="${idx}"]`); if (btn) btn.click(); }
            }
            // 视角预设快捷持F1-F3
            else if (e.key === 'F1') { e.preventDefault(); animateToView('front'); }
            else if (e.key === 'F2') { e.preventDefault(); animateToView('side'); }
            else if (e.key === 'F3') { e.preventDefault(); animateToView('close'); }
        });
        document.addEventListener('keyup', (e) => { pressedKeys.delete(e.key.toLowerCase()); });

        // ══════════════════════════════════════════════════
        //  动画循环
        // ══════════════════════════════════════════════════
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta(), elapsed = clock.getElapsedTime();
            controls.update(); updateIntroPanel();
            bellMeshes.forEach((bell, i) => { const offset = i * 0.11; bell.position.y += Math.sin(elapsed * 0.35 + offset) * 0.0007; });
            curtains.forEach((curtain) => {
                const geo = curtain.geometry, pos = geo.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const y = pos.getY(i);
                    const wave = Math.sin(elapsed * 0.65 + y * 1.3 + curtain.userData.phase) * 0.1 * (y / 3.5 + 0.3);
                    pos.setZ(i, wave);
                }
                pos.needsUpdate = true; geo.computeVertexNormals();
            });
            // 宫灯闪烁+光晕脉动
            lanterns.forEach(l => {
                const { light, innerLight, baseIntensity, baseInner, phase, glow } = l.userData;
                const flicker = 0.85 + Math.sin(elapsed * 3 + phase) * 0.12 + Math.sin(elapsed * 7 + phase*2) * 0.03;
                light.intensity = baseIntensity * flicker;
                innerLight.intensity = baseInner * flicker;
                if (glow) { const s = 1 + Math.sin(elapsed * 2 + phase) * 0.08; glow.scale.set(s, s, s); }
            });
            // 灯柱灯笼闪烁
            lampPosts.forEach(lp => {
                lp.children.forEach(child => {
                    if (child.userData && child.userData.light) {
                        child.userData.light.intensity = child.userData.baseIntensity * (0.85 + Math.sin(elapsed * 2.5 + child.userData.phase) * 0.15);
                    }
                });
            });
            // 悬挂灯笼闪烁
            hangingLanterns.children.forEach(child => {
                if (child.userData && child.userData.light) {
                    child.userData.light.intensity = child.userData.baseIntensity * (0.82 + Math.sin(elapsed * 2.8 + child.userData.phase) * 0.18);
                }
            });
            // 烛台火焰（更明亮的闪烁）
            candelabrums.forEach(c => {
                c.traverse(obj => {
                    if (obj.isPointLight) {
                        const baseIntensity = obj.userData.baseIntensity || 1.2;
                        if (!obj.userData.baseIntensity) obj.userData.baseIntensity = obj.intensity;
                        const flicker = 0.75 + Math.sin(elapsed * 9 + c.userData.phase) * 0.18 + Math.sin(elapsed * 15 + c.userData.phase * 2) * 0.07;
                        obj.intensity = obj.userData.baseIntensity * flicker;
                    }
                });
            });
            // 动态光束脉持
            lightBeams.forEach(beam => {
                const pulse = 0.7 + Math.sin(elapsed * 1.5 + beam.userData.phase) * 0.3;
                beam.material.opacity = beam.userData.baseOpacity * pulse;
                beam.scale.x = 1 + Math.sin(elapsed * 0.8 + beam.userData.phase) * 0.05;
                beam.scale.z = 1 + Math.cos(elapsed * 0.8 + beam.userData.phase) * 0.05;
            });
            // 香炉烟雾
            incenseBurners.forEach(burner => {
                const { smoke, smokeSpeed, smokeOffset, smokeCount } = burner.userData;
                const pos = smoke.geometry.attributes.position;
                for (let i = 0; i < smokeCount; i++) {
                    let y = pos.getY(i); y += smokeSpeed[i] * delta;
                    if (y > 3.2) { y = 0; pos.setX(i, (Math.random() - 0.5) * 0.14); pos.setZ(i, (Math.random() - 0.5) * 0.14); }
                    const x = pos.getX(i) + Math.sin(elapsed * 1.3 + smokeOffset[i]) * delta * 0.18;
                    const z = pos.getZ(i) + Math.cos(elapsed * 1.0 + smokeOffset[i]) * delta * 0.12;
                    pos.setX(i, x); pos.setY(i, y); pos.setZ(i, z);
                }
                pos.needsUpdate = true;
            });
            // 银杏持
            for (let i = 0; i < leafCount; i++) {
                leafPos[i*3+1] -= leafSpeed[i] * delta;
                leafPos[i*3] += Math.sin(elapsed * 0.65 + leafSway[i]) * delta * 0.35;
                leafRot[i] += delta * 1.7;
                if (leafPos[i*3+1] < -0.5) { leafPos[i*3] = (Math.random() - 0.5) * 24; leafPos[i*3+1] = 12 + Math.random() * 3; leafPos[i*3+2] = (Math.random() - 0.5) * 18 - 2; }
                leafDummy.position.set(leafPos[i*3], leafPos[i*3+1], leafPos[i*3+2]);
                leafDummy.rotation.set(leafRot[i], leafRot[i] * 0.55, leafRot[i] * 0.35);
                leafDummy.updateMatrix(); leaves.setMatrixAt(i, leafDummy.matrix);
            }
            leaves.instanceMatrix.needsUpdate = true;
            groundLight.intensity = 1.0 + Math.sin(elapsed * 1.4) * 0.2;
            renderer.render(scene, camera); labelRenderer.render(scene, camera);
        }

        setTimeout(() => { loading.classList.add('hidden'); setTimeout(() => { loading.style.display = 'none'; }, 1300); }, 1200);
        document.addEventListener('click', initAudio, { once: true });
        document.addEventListener('touchstart', initAudio, { once: true });
        animate();
        setTimeout(() => { controlsHint.style.opacity = '0'; }, 12000);
        setTimeout(() => { infoName.textContent = '🎵 点击编钟演奏'; infoDetail.textContent = '曾侯乙墓出土 · 全套65件'; infoPitch.textContent = '🖱 拖动旋转 · 滚轮缩放 · 拉近隐藏简介'; }, 1700);
        console.log('🎵 曾侯乙编持· 宫廷雅乐 · 燕云十六声风持v5');
    
    
    
    </script>
</body>
</html>
